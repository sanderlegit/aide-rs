# This document provides a detailed, line-by-line explanation of how a typical
# workflow file is executed by `aide-rs`. It breaks down each step, explaining
# how context is built and which models are used.
#
# The workflow is executed sequentially. Each step can use the artifacts
# (e.g., research files, plans) generated by the previous steps.

# The `steps` key contains a list of actions for the agent to perform in order.
# Each item in the list is a "step" with a specific `type`.
steps:
  - type: research
    # `type: research`: This step uses a search-enabled LLM to gather information
    # on a given topic. It's ideal for finding up-to-date information like the
    # latest library versions or best practices.
    #
    # Model Used: By default, this will use the `gemini-2.5-pro` model. This can be
    # overridden with a `model:` key in this step or a global `--model` flag.
    # The `googleSearch` tool is automatically enabled for this step.

    objective: |
      # `objective`: This is the core prompt for the research step. It defines
      # the topic the LLM should investigate.
      Find the latest versions of these crates for me to use in implementing my rust audio project
      - `lancedb`: For database operations.
      - `clap`: For parsing command-line arguments.
      - `hound`: For reading `.wav` file headers and data.
      - `rodio`: For audio playback.
      - `thiserror`: For custom error handling.
      - `tokio`: For the async runtime.
      - `tracing`: For logging.

    context: "all"
    # `context: "all"`: This tells `aide-rs` to find all files in the current
    # project that match the `.ai/filter=all` rules. The paths of these files
    # are added to the prompt to give the LLM context about the existing project.

    output: "research/crates.md"
    # `output`: This specifies the file where the research findings will be saved.
    # This file will be automatically included in the context for subsequent steps.

  - type: plan
    # `type: plan`: This step uses an LLM to create a detailed, step-by-step
    # implementation plan based on an objective.
    #
    # Model Used: Defaults to `gemini-2.5-pro`, unless overridden.

    objective: |
      # `objective`: The high-level goal for the planning step.
      Create a command-line tool in Rust named `audio_db` that uses LanceDB to manage a collection of `.wav` audio files.
      Please use the information from the research document to determine the latest versions of the crates to use.

      The tool should have the following subcommands:
      1. `add <PATH>`: Reads a `.wav` file from the given path, extracts its properties (channels, sample rate, duration), and adds a record to a LanceDB table. The table should be created if it doesn't exist. The record should store the file path, channels, sample rate, and duration in seconds.
      2. `list`: Queries the LanceDB table and prints a formatted list of all audio files, including their ID, path, and properties.
      3. `play <ID>`: Plays the audio file corresponding to the given ID from the database.

      Key Crates to Use:
      - `lancedb`: For database operations.
      - `clap`: For parsing command-line arguments.
      - `hound`: For reading `.wav` file headers and data.
      - `rodio`: For audio playback.
      - `thiserror`: For custom error handling.
      - `tokio`: For the async runtime.
      - `tracing`: For logging.

      Coding Conventions:
      - The project must be a new binary crate, initialized with `cargo init --bin audio_db`.
      - All dependencies must be added to `Cargo.toml`.
      - You must write a Makefile with a `make test` target that includes a static check (`cargo check`) and runs all appropriate tests as they are added.
      - Use `clap` with the `derive` feature for CLI parsing. Define a `Cli` struct and a `Commands` enum for the subcommands.
      - Create a custom `Error` enum using `thiserror` to handle all potential failures (I/O, LanceDB, audio processing, etc.).
      - All public functions, structs, and enums must have clear doc comments.
      - Use the `tracing` crate for logging. Set up a simple subscriber in `main.rs`.
      - The LanceDB table should be stored at a default path like `./data/audio.lance`. The `add` command should create this directory if it doesn't exist.
      - For the `play` command, read the audio data from the file path stored in LanceDB and use `rodio` to play it back.
      - The code should be well-structured. Consider creating separate modules for CLI, database logic, and audio handling if the complexity grows.

    context: "all"
    # `context: "all"`: As before, this includes all project files.
    #
    # Implicit Context: The `plan` step automatically includes the content of the
    # `research/crates.md` file (generated by the previous step) in its prompt,
    # allowing it to use the research findings.

  - type: implement
    # `type: implement`: This is the final step, where the agent uses `aider`
    # to write and modify code based on a plan. It runs in a fully automated loop.
    #
    # Model Used: This step uses two models:
    # 1. `aider` is invoked, which uses the model configured in your `.env` file
    #    (e.g., `vertex_ai/gemini-2.5-pro`).
    # 2. If the validation command fails, `aide-rs` uses its own default model
    #    (`gemini-2.5-pro`) for the debugging analysis step.

    objective: "Implement the plan to create the audio_db tool."
    # `objective`: This provides an initial high-level objective.
    #
    # Implicit Context: The `implement` step automatically modifies this objective
    # to be: "Implement the tasks described in the plan file...". It then adds
    # the content of the `plan.md` and `research.md` files to the `aider` chat,
    # providing full context for the implementation.

    context: "all"
    # `context: "all"`: All project files are added to the `aider` chat.

    validate_cmd: "make test"
    # `validate_cmd`: The command to run after `aider` makes changes. `aide-rs`
    # uses the exit code of this command to determine if the implementation was
    # successful. `aider` will commit the changes upon success.

    max_retries: 10
    # `max_retries`: The number of times the agent will try to fix the code if
    # the `validate_cmd` fails.

    allow_shell_commands: true
    # `allow_shell_commands`: (Optional, defaults to false) Can be set to `true`
    # to allow `aider` to execute shell commands during the implementation.
