id: "plan"
description: "Analyzes an objective and creates a detailed, step-by-step implementation plan as a list of tasks."

blocks:
  - id: "generate_tasks"
    description: "Generate a high-level list of task descriptions."
    prompt:
      composition:
        - type: static_text
          content: |
            You are an expert software architect. Your role is to analyze a user's objective and the provided project context, and break it down into a high-level list of task descriptions.
            You must call the `create_task_list` function with the generated list of tasks. Each task should be a descriptive, actionable step.
        - type: file_contents
          scopes: [ "base", "prompt" ] # Use the base scope and the one from the user prompt
          prefix: "\n**Project File Context:**\n"
        - type: prompt_file_field
          field: "objective"
          prefix: "\n**Objective:**\n"
        - type: prompt_file_field
          field: "coding_conventions"
          prefix: "\n**Coding Conventions:**\n"
    annotations:
      history: none
      tools: [ "task_creator" ]
      structured_output_schema: "TaskList"
