id: "code"
description: "Analyzes an objective, creates a plan, and implements it."
model: "gemini-2.5-pro"

blocks:
  - id: "generate_markdown_plan"
    description: "Generate a high-level implementation plan in markdown."
    prompt:
      composition:
        - type: static_text
          content: |
            You are an expert software architect. Your role is to analyze a user's objective against the provided project context and create a concise, human-readable implementation plan in Markdown format for the required changes.
            The plan should focus only on the delta required to achieve the objective. Do not describe work that has already been completed.
            The plan should outline the strategy, including new files to create, tests to add, and logic changes. This is a creative step to think through the solution before generating structured tasks.
            **Do not write any code or code diffs.** The output should be a prose description of the plan, not the implementation itself.
        - type: prompt_file_field
          field: "objective"
          prefix: "\n**Objective:**\n"
        - type: prompt_file_field
          field: "coding_conventions"
          prefix: "\n**Coding Conventions:**\n"
          hide_in_stdout: true
    annotations:
      history: none
      tools: [] # No tools, just text output

  - id: "generate_structured_tasks"
    description: "Convert the markdown plan into a structured list of tasks."
    prompt:
      composition:
        - type: static_text
          content: |
            You are an expert system. Your role is to convert the provided markdown plan into a structured list of tasks using the `create_task_list` tool.
            Each task should be a descriptive, actionable step that can be implemented independently.
        - type: file_list
          scopes: [ "base", "ai"]
          prefix: "\n**Available Project Files:**\n"
        - type: file_contents
          scopes: [ "base", "prompt" ]
          prefix: "\n**Project File Context:**\n"
          hide_in_stdout: true
        - type: prompt_file_field
          field: "objective"
          prefix: "\n**Objective:**\n"
          hide_in_stdout: true
        - type: previous_output
          block_id: "generate_markdown_plan"
          prefix: "\n**Markdown Plan:**\n"
    annotations:
      history: none
      tools: [ "task_creator" ]
      structured_output_schema: "TaskList"

  - id: "implement_tasks"
    description: "Iterate through the generated tasks and implement them."
    looping:
      over: "generate_structured_tasks"
      as: "current_task"
      commit_on_iteration_success: true
    prompt:
      composition:
        - type: static_text
          content: |
            You are an expert pair programmer. Your goal is to implement the current task.
            Analyze the task description and the provided code. Use the available tools to modify files.
            If you are unsure about an API, use the `doc_retriever` tool to get documentation.
            Once you have made your changes, explain your solution.
        - type: file_list
          scopes: [ "base" ]
          prefix: "\n**Available Project Files:**\n"
        - type: file_contents
          scopes: [ "base" ]
          prefix: "\n**Project File Context:**\n"
          hide_in_stdout: true
        - type: prompt_file_field
          field: "objective"
          prefix: "\n**Objective:**\n"
          hide_in_stdout: true
        - type: prompt_file_field
          field: "coding_conventions"
          prefix: "\n**Coding Conventions:**\n"
          hide_in_stdout: true
        - type: previous_output # This is the current task description from the loop
          block_id: "current_task"
          prefix: "\n**Current Task:**\n"
    annotations:
      history: full
      tools: [ "file_system", "doc_retriever" ]
    verification:
      max_retries: 10
      strategy:
        type: command
        command: "make test"
        expected_exit_code: 0
        on_failure_prompt:
          composition:
            - type: static_text
              content: "The last attempt failed validation. Please analyze the error, fix the code, and explain the fix."
            - type: previous_output # This would be the output of the failed `cargo check`
              block_id: "implement_tasks" # Special reference to the verification output
              prefix: "\n**Validation Error:**\n"
              hide_in_stdout: true
